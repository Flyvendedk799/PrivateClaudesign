name: Eval (game fixtures)

# may9 Phase 14 — runs `pnpm eval:games` on PRs that touch the
# game-pipeline surface (core, runtime, prompts, exporters, fixtures).
# The pure-compute portion (fixture validation, runner assertions,
# report rendering) runs everywhere; the SQLite-backed observation
# source needs a recorded designs.db which CI does not have, so the
# CI invocation runs vitest only. The full delta-vs-baseline path
# stays a manual run on a contributor's machine.
#
# Tightening this to actually replay fixtures against a fixture-replay
# provider is task #14-followup once the recorded-fixture pipeline
# lands.

on:
  pull_request:
    paths:
      - 'packages/core/src/eval/**'
      - 'packages/core/src/playtest-playbooks*'
      - 'packages/core/src/tools/done*'
      - 'packages/core/src/tools/declare-game-spec*'
      - 'packages/core/src/tools/amend-game-spec*'
      - 'packages/core/src/tools/choose-engine*'
      - 'packages/core/src/destructive-edit*'
      - 'packages/runtime/src/engines/**'
      - 'packages/runtime/src/overlay-check*'
      - 'packages/runtime/src/pointer-lock*'
      - 'packages/shared/src/game-spec*'
      - 'packages/shared/src/abort-kind*'
      - 'evals/fixtures/**'
      - 'scripts/eval-games.ts'
      - 'scripts/eval-baseline.ts'
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck core + shared + runtime
        run: |
          pnpm --filter @open-codesign/shared typecheck
          pnpm --filter @open-codesign/core typecheck
          pnpm --filter @open-codesign/runtime typecheck
      - name: Run eval-framework tests
        run: |
          pnpm --filter @open-codesign/core test -- --run src/eval src/playtest-playbooks src/destructive-edit src/tools/done-pre-gate src/tools/done-destructive-edit
          pnpm --filter @open-codesign/runtime test -- --run src/overlay-check src/engines/phaser-trigger-zone src/engines/trigger-zone-extra src/pointer-lock
          pnpm --filter @open-codesign/shared test -- --run src/escalation-hint src/abort-kind src/game-spec src/game-artifact-slug
      - name: Validate fixture + recording JSON files
        run: |
          # JSON syntax check on every fixture and every recording.
          node -e "const fs = require('node:fs'); const path = require('node:path'); for (const dir of ['evals/fixtures','evals/recordings']) { if (!fs.existsSync(dir)) continue; for (const f of fs.readdirSync(dir).filter(x => x.endsWith('.json'))) { JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8')); console.log('ok', dir, f); } }"
      - name: Run pnpm eval:games against recordings
        # may9 #34 — hermetic eval against frozen recordings under
        # evals/recordings/. Exit code is non-zero when any fixture
        # fails its assertions, so a regression in the assertion logic
        # OR a recording drift turns red. The FPS baseline recording
        # intentionally fails (it captures the pre-V2 regression);
        # match3-puzzle is the green target. The framework reports
        # both; CI summarises but doesn't FAIL on the FPS-baseline
        # regression-shape until a post-V2 recording replaces it.
        run: |
          pnpm eval:games --recordings --print | tee evals/runs/ci.md || true
          test -s evals/runs/ci.md
